<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<title>Ashvik's Flag Quiz</title>
<style>
  :root {
    --primary: #6c63ff;
    --primary-dark: #5148e5;
    --secondary: #ffca3a;
    --bg: #f5f7ff;
    --card: rgba(255,255,255,.92);
    --text: #20233a;
    --muted: #737895;
    --shadow: 0 18px 45px rgba(51, 57, 120, .14);
    --radius: 26px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 10% 10%, rgba(255,202,58,.22), transparent 28%),
      radial-gradient(circle at 90% 15%, rgba(108,99,255,.18), transparent 30%),
      linear-gradient(145deg, #f9fbff 0%, #eef1ff 100%);
    min-height: 100vh;
  }

  button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 760px;
    min-height: 100vh;
    margin: auto;
    padding: 18px 18px calc(30px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    min-height: 50px;
  }

  .home-btn {
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 15px;
    background: rgba(255,255,255,.88);
    box-shadow: 0 8px 25px rgba(45,52,100,.10);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform .18s ease, background .18s ease;
  }
  .home-btn:hover { transform: translateY(-2px); background: #fff; }
  .home-btn:active { transform: scale(.94); }
  .home-btn svg { width: 22px; height: 22px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hero {
    text-align: center;
    padding: 15px 0 25px;
  }

  .logo {
    width: 78px;
    height: 78px;
    margin: 0 auto 16px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--primary), #8d78ff);
    box-shadow: 0 15px 35px rgba(108,99,255,.28);
    font-size: 40px;
    transform: rotate(-3deg);
  }

  h1 {
    font-size: clamp(30px, 7vw, 48px);
    line-height: 1.05;
    margin: 0;
    letter-spacing: -1.5px;
  }

  .subtitle {
    margin: 10px auto 0;
    color: var(--muted);
    font-size: 16px;
    max-width: 480px;
    line-height: 1.5;
  }

  .continent-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 13px;
    width: 100%;
    max-width: 610px;
    margin: 0 auto;
  }

  .continent-btn {
    border: 0;
    background: var(--card);
    color: var(--text);
    border-radius: 22px;
    padding: 18px 14px;
    min-height: 105px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-weight: 750;
  }
  .continent-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 22px 50px rgba(51,57,120,.18);
  }
  .continent-btn:active { transform: scale(.97); }
  .continent-icon { font-size: 34px; }
  .continent-name { font-size: 16px; }
  .continent-count { color: var(--muted); font-size: 12px; font-weight: 600; }

  .quiz {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding-top: 15px;
  }

  .quiz-top {
    text-align: center;
    margin-bottom: 16px;
  }
  .quiz-title {
    font-size: 18px;
    font-weight: 800;
    margin: 0;
  }
  .quiz-hint {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .flag-card {
    position: relative;
    background: rgba(255,255,255,.96);
    border-radius: var(--radius);
    padding: clamp(16px, 4vw, 28px);
    box-shadow: var(--shadow);
    cursor: pointer;
    user-select: none;
    outline: none;
  }

  .flag-card:focus-visible {
    box-shadow: 0 0 0 4px rgba(108,99,255,.25), var(--shadow);
  }

  .flag-frame {
    width: 100%;
    aspect-ratio: 3 / 2;
    border-radius: 17px;
    overflow: hidden;
    background: #edf0f8;
    box-shadow: 0 9px 25px rgba(35,40,80,.14);
    display: grid;
    place-items: center;
  }

  .flag-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: transform .35s ease;
  }

  .flag-card:hover .flag-image { transform: scale(1.015); }

  .tap-hint {
    text-align: center;
    margin: 15px 0 2px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .answer {
    min-height: 43px;
    display: grid;
    place-items: center;
    text-align: center;
    margin-top: 3px;
  }

  .country-name {
    font-size: clamp(23px, 6vw, 32px);
    font-weight: 850;
    letter-spacing: -.5px;
    animation: pop .3s ease both;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(7px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .next-btn {
    width: 100%;
    border: 0;
    border-radius: 18px;
    margin-top: 17px;
    min-height: 57px;
    padding: 13px 20px;
    background: linear-gradient(135deg, var(--primary), #8076ff);
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(108,99,255,.28);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .next-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 17px 34px rgba(108,99,255,.34);
  }
  .next-btn:active { transform: scale(.98); }

  .loading {
    color: var(--muted);
    font-weight: 700;
    font-size: 15px;
  }

  .spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #dfe2f3;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    text-align: center;
    color: #bd4252;
    font-size: 14px;
    font-weight: 700;
    padding: 15px;
  }

  .hidden { display: none !important; }

  .fade-in { animation: fade .35s ease both; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (min-width: 600px) {
    .app { padding: 24px 25px 40px; }
    .continent-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .continent-btn { min-height: 125px; }
    .logo { width: 88px; height: 88px; }
  }

  @media (max-width: 380px) {
    .app { padding-left: 13px; padding-right: 13px; }
    .continent-grid { gap: 9px; }
    .continent-btn { min-height: 95px; padding: 12px 8px; }
    .continent-icon { font-size: 29px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="home-btn hidden" id="homeBtn" aria-label="Go to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8"></path>
        <path d="M5.5 9.5V21h13V9.5"></path>
        <path d="M9.5 21v-7h5v7"></path>
      </svg>
    </button>
  </header>

  <main>
    <section id="homePage">
      <div class="hero">
        <div class="logo" aria-hidden="true">🌍</div>
        <h1>Ashvik's Flag Quiz</h1>
        <p class="subtitle">Choose a continent and see how many flags you can recognise!</p>
      </div>
      <div class="continent-grid" id="continentGrid"></div>
    </section>

    <section id="quizPage" class="quiz hidden">
      <div class="quiz-top">
        <p class="quiz-title" id="quizTitle"></p>
        <p class="quiz-hint">Tap the flag to reveal the country</p>
      </div>

      <div class="flag-card" id="flagCard" tabindex="0" role="button" aria-label="Flag. Tap to reveal the country name.">
        <div class="flag-frame" id="flagFrame">
          <div class="spinner" id="spinner" aria-label="Loading flag"></div>
          <img id="flagImage" class="flag-image hidden" alt="Country flag">
        </div>
        <div class="tap-hint" id="tapHint">👆 Tap the flag</div>
        <div class="answer" id="answer" aria-live="polite"></div>
      </div>

      <button class="next-btn" id="nextBtn">Next Flag&nbsp; →</button>
    </section>
  </main>
</div>

<script>
/*
  Ashvik's Flag Quiz
  Flag images are loaded from the REST Countries free flag CDN:
  https://flags.restcountries.com/v5/svg/{ISO-2-CODE}.svg
*/

const countries = [
  // Africa
  ["Algeria","dz","Africa"],["Angola","ao","Africa"],["Benin","bj","Africa"],
  ["Botswana","bw","Africa"],["Burkina Faso","bf","Africa"],["Burundi","bi","Africa"],
  ["Cabo Verde","cv","Africa"],["Cameroon","cm","Africa"],["Central African Republic","cf","Africa"],
  ["Chad","td","Africa"],["Comoros","km","Africa"],["Republic of the Congo","cg","Africa"],
  ["Democratic Republic of the Congo","cd","Africa"],["Djibouti","dj","Africa"],["Egypt","eg","Africa"],
  ["Equatorial Guinea","gq","Africa"],["Eritrea","er","Africa"],["Eswatini","sz","Africa"],
  ["Ethiopia","et","Africa"],["Gabon","ga","Africa"],["Gambia","gm","Africa"],
  ["Ghana","gh","Africa"],["Guinea","gn","Africa"],["Guinea-Bissau","gw","Africa"],
  ["Ivory Coast","ci","Africa"],["Kenya","ke","Africa"],["Lesotho","ls","Africa"],
  ["Liberia","lr","Africa"],["Libya","ly","Africa"],["Madagascar","mg","Africa"],
  ["Malawi","mw","Africa"],["Mali","ml","Africa"],["Mauritania","mr","Africa"],
  ["Mauritius","mu","Africa"],["Morocco","ma","Africa"],["Mozambique","mz","Africa"],
  ["Namibia","na","Africa"],["Niger","ne","Africa"],["Nigeria","ng","Africa"],
  ["Rwanda","rw","Africa"],["Sao Tome and Principe","st","Africa"],["Senegal","sn","Africa"],
  ["Seychelles","sc","Africa"],["Sierra Leone","sl","Africa"],["Somalia","so","Africa"],
  ["South Africa","za","Africa"],["South Sudan","ss","Africa"],["Sudan","sd","Africa"],
  ["Tanzania","tz","Africa"],["Togo","tg","Africa"],["Tunisia","tn","Africa"],
  ["Uganda","ug","Africa"],["Zambia","zm","Africa"],["Zimbabwe","zw","Africa"],

  // Asia
  ["Afghanistan","af","Asia"],["Armenia","am","Asia"],["Azerbaijan","az","Asia"],
  ["Bahrain","bh","Asia"],["Bangladesh","bd","Asia"],["Bhutan","bt","Asia"],
  ["Brunei","bn","Asia"],["Cambodia","kh","Asia"],["China","cn","Asia"],
  ["Cyprus","cy","Asia"],["Georgia","ge","Asia"],["India","in","Asia"],
  ["Indonesia","id","Asia"],["Iran","ir","Asia"],["Iraq","iq","Asia"],
  ["Israel","il","Asia"],["Japan","jp","Asia"],["Jordan","jo","Asia"],
  ["Kazakhstan","kz","Asia"],["Kuwait","kw","Asia"],["Kyrgyzstan","kg","Asia"],
  ["Laos","la","Asia"],["Lebanon","lb","Asia"],["Malaysia","my","Asia"],
  ["Maldives","mv","Asia"],["Mongolia","mn","Asia"],["Myanmar","mm","Asia"],
  ["Nepal","np","Asia"],["North Korea","kp","Asia"],["Oman","om","Asia"],
  ["Pakistan","pk","Asia"],["Palestine","ps","Asia"],["Philippines","ph","Asia"],
  ["Qatar","qa","Asia"],["Saudi Arabia","sa","Asia"],["Singapore","sg","Asia"],
  ["South Korea","kr","Asia"],["Sri Lanka","lk","Asia"],["Syria","sy","Asia"],
  ["Taiwan","tw","Asia"],["Tajikistan","tj","Asia"],["Thailand","th","Asia"],
  ["Timor-Leste","tl","Asia"],["Turkey","tr","Asia"],["Turkmenistan","tm","Asia"],
  ["United Arab Emirates","ae","Asia"],["Uzbekistan","uz","Asia"],["Vietnam","vn","Asia"],
  ["Yemen","ye","Asia"],

  // Europe
  ["Albania","al","Europe"],["Andorra","ad","Europe"],["Austria","at","Europe"],
  ["Belarus","by","Europe"],["Belgium","be","Europe"],["Bosnia and Herzegovina","ba","Europe"],
  ["Bulgaria","bg","Europe"],["Croatia","hr","Europe"],["Czechia","cz","Europe"],
  ["Denmark","dk","Europe"],["Estonia","ee","Europe"],["Finland","fi","Europe"],
  ["France","fr","Europe"],["Germany","de","Europe"],["Greece","gr","Europe"],
  ["Hungary","hu","Europe"],["Iceland","is","Europe"],["Ireland","ie","Europe"],
  ["Italy","it","Europe"],["Latvia","lv","Europe"],["Liechtenstein","li","Europe"],
  ["Lithuania","lt","Europe"],["Luxembourg","lu","Europe"],["Malta","mt","Europe"],
  ["Moldova","md","Europe"],["Monaco","mc","Europe"],["Montenegro","me","Europe"],
  ["Netherlands","nl","Europe"],["North Macedonia","mk","Europe"],["Norway","no","Europe"],
  ["Poland","pl","Europe"],["Portugal","pt","Europe"],["Romania","ro","Europe"],
  ["Russia","ru","Europe"],["San Marino","sm","Europe"],["Serbia","rs","Europe"],
  ["Slovakia","sk","Europe"],["Slovenia","si","Europe"],["Spain","es","Europe"],
  ["Sweden","se","Europe"],["Switzerland","ch","Europe"],["Ukraine","ua","Europe"],
  ["United Kingdom","gb","Europe"],["Vatican City","va","Europe"],

  // North America
  ["Antigua and Barbuda","ag","North America"],["Bahamas","bs","North America"],
  ["Barbados","bb","North America"],["Belize","bz","North America"],
  ["Canada","ca","North America"],["Costa Rica","cr","North America"],
  ["Cuba","cu","North America"],["Dominica","dm","North America"],
  ["Dominican Republic","do","North America"],["El Salvador","sv","North America"],
  ["Grenada","gd","North America"],["Guatemala","gt","North America"],
  ["Haiti","ht","North America"],["Honduras","hn","North America"],
  ["Jamaica","jm","North America"],["Mexico","mx","North America"],
  ["Nicaragua","ni","North America"],["Panama","pa","North America"],
  ["Saint Kitts and Nevis","kn","North America"],["Saint Lucia","lc","North America"],
  ["Saint Vincent and the Grenadines","vc","North America"],["Trinidad and Tobago","tt","North America"],
  ["United States","us","North America"],

  // South America
  ["Argentina","ar","South America"],["Bolivia","bo","South America"],
  ["Brazil","br","South America"],["Chile","cl","South America"],
  ["Colombia","co","South America"],["Ecuador","ec","South America"],
  ["Guyana","gy","South America"],["Paraguay","py","South America"],
  ["Peru","pe","South America"],["Suriname","sr","South America"],
  ["Uruguay","uy","South America"],["Venezuela","ve","South America"],

  // Oceania
  ["Australia","au","Oceania"],["Fiji","fj","Oceania"],["Kiribati","ki","Oceania"],
  ["Marshall Islands","mh","Oceania"],["Micronesia","fm","Oceania"],
  ["Nauru","nr","Oceania"],["New Zealand","nz","Oceania"],["Palau","pw","Oceania"],
  ["Papua New Guinea","pg","Oceania"],["Samoa","ws","Oceania"],["Solomon Islands","sb","Oceania"],
  ["Tonga","to","Oceania"],["Tuvalu","tv","Oceania"],["Vanuatu","vu","Oceania"]
].map(([name, code, continent]) => ({name, code, continent}));

const continentInfo = {
  "Africa": { icon: "🌍" },
  "Asia": { icon: "🌏" },
  "Europe": { icon: "🌍" },
  "North America": { icon: "🌎" },
  "South America": { icon: "🌎" },
  "Oceania": { icon: "🌊" }
};

const homePage = document.getElementById("homePage");
const quizPage = document.getElementById("quizPage");
const continentGrid = document.getElementById("continentGrid");
const homeBtn = document.getElementById("homeBtn");
const quizTitle = document.getElementById("quizTitle");
const flagCard = document.getElementById("flagCard");
const flagImage = document.getElementById("flagImage");
const flagFrame = document.getElementById("flagFrame");
const spinner = document.getElementById("spinner");
const tapHint = document.getElementById("tapHint");
const answer = document.getElementById("answer");
const nextBtn = document.getElementById("nextBtn");

let selectedContinent = null;
let currentCountry = null;
let lastCountry = null;
let revealed = false;

function countFor(continent) {
  return countries.filter(c => c.continent === continent).length;
}

function renderContinents() {
  continentGrid.innerHTML = Object.keys(continentInfo).map(continent => `
    <button class="continent-btn fade-in" data-continent="${continent}">
      <span class="continent-icon">${continentInfo[continent].icon}</span>
      <span class="continent-name">${continent}</span>
      <span class="continent-count">${countFor(continent)} countries</span>
    </button>
  `).join("");

  continentGrid.querySelectorAll(".continent-btn").forEach(btn => {
    btn.addEventListener("click", () => startQuiz(btn.dataset.continent));
  });
}

function startQuiz(continent) {
  selectedContinent = continent;
  homePage.classList.add("hidden");
  quizPage.classList.remove("hidden");
  homeBtn.classList.remove("hidden");
  quizTitle.textContent = `${continentInfo[continent].icon} ${continent}`;
  nextFlag();
}

function chooseRandomCountry() {
  const pool = countries.filter(c => c.continent === selectedContinent);
  if (pool.length === 1) return pool[0];

  let chosen;
  do {
    chosen = pool[Math.floor(Math.random() * pool.length)];
  } while (lastCountry && chosen.code === lastCountry.code);

  return chosen;
}

function flagUrl(code) {
  return `https://flags.restcountries.com/v5/svg/${code}.svg`;
}

function nextFlag() {
  currentCountry = chooseRandomCountry();
  lastCountry = currentCountry;
  revealed = false;

  answer.innerHTML = "";
  tapHint.textContent = "👆 Tap the flag";
  flagImage.classList.add("hidden");
  spinner.classList.remove("hidden");
  flagImage.removeAttribute("src");
  flagImage.alt = "Loading country flag";

  // Changing the image source triggers a fresh browser request.
  flagImage.src = flagUrl(currentCountry.code);
}

flagImage.addEventListener("load", () => {
  spinner.classList.add("hidden");
  flagImage.classList.remove("hidden");
});

flagImage.addEventListener("error", () => {
  spinner.classList.add("hidden");
  flagImage.classList.add("hidden");
  flagFrame.innerHTML = `<div class="error">Couldn't load this flag.<br>Please tap “Next Flag”.</div>`;
});

function revealAnswer() {
  if (!currentCountry || revealed) return;
  revealed = true;
  tapHint.textContent = "✨ Great job!";

  answer.innerHTML = `<div class="country-name">${escapeHtml(currentCountry.name)}</div>`;
}

flagCard.addEventListener("click", revealAnswer);
flagCard.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    revealAnswer();
  }
});

nextBtn.addEventListener("click", nextFlag);

homeBtn.addEventListener("click", () => {
  selectedContinent = null;
  currentCountry = null;
  lastCountry = null;
  quizPage.classList.add("hidden");
  homeBtn.classList.add("hidden");
  homePage.classList.remove("hidden");
  renderContinents();
});

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[ch]));
}

renderContinents();
</script>
</body>
</html>
