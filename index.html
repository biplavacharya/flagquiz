<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashvik's Flag Quiz</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-hover: #357ABD;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .home-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
            display: none;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .content {
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #home-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #home-screen h2 {
            margin-bottom: 10px;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        .continent-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .continent-btn:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        #quiz-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .flag-container {
            width: 100%;
            max-width: 300px;
            height: 200px;
            background-color: #eee;
            border-radius: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.2s;
        }

        .flag-container:hover {
            transform: scale(1.02);
        }

        .flag-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .click-hint {
            position: absolute;
            bottom: -30px;
            font-size: 0.8rem;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 2px 10px;
            border-radius: 10px;
            transition: opacity 0.3s;
        }

        #country-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            min-height: 36px;
            margin-bottom: 25px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
            transition: all 0.2s;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.6);
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
        }
        
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="home-btn" id="home-btn" onclick="goHome()" aria-label="Home">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </button>
            <h1>Ashvik's Flag Quiz</h1>
        </header>

        <div class="content">
            <div id="loading-screen">
                <div class="spinner"></div>
                <p id="loading-text">Loading flags from around the world...</p>
            </div>

            <div id="home-screen" style="display: none;">
                <p id="fallback-notice" style="display:none; color:orange; font-size: 0.8rem; margin-bottom: 10px;">Running in fallback mode</p>
                <h2>Choose a Continent</h2>
                <button class="continent-btn" onclick="startQuiz('Africa')">Africa</button>
                <button class="continent-btn" onclick="startQuiz('Americas')">Americas</button>
                <button class="continent-btn" onclick="startQuiz('Asia')">Asia</button>
                <button class="continent-btn" onclick="startQuiz('Europe')">Europe</button>
                <button class="continent-btn" onclick="startQuiz('Oceania')">Oceania</button>
            </div>

            <div id="quiz-screen">
                <p style="margin-bottom: 15px; color: var(--text-muted);" id="continent-title"></p>
                
                <div class="flag-container" onclick="revealCountry()">
                    <img id="flag-image" src="" alt="Country Flag">
                    <div class="click-hint" id="click-hint">Tap flag to reveal</div>
                </div>
                
                <div id="country-name">Country Name</div>
                
                <button class="next-btn" onclick="nextFlag()">Next Flag</button>
            </div>
        </div>
    </div>

    <script>
        let allCountries = [];
        let currentFilteredCountries = [];
        let currentCountry = null;

        const loadingScreen = document.getElementById('loading-screen');
        const homeScreen = document.getElementById('home-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const homeBtn = document.getElementById('home-btn');
        const flagImage = document.getElementById('flag-image');
        const countryNameDisplay = document.getElementById('country-name');
        const continentTitle = document.getElementById('continent-title');
        const clickHint = document.getElementById('click-hint');
        const fallbackNotice = document.getElementById('fallback-notice');

        // FALLBACK DATA in case the API is blocked or down
        const fallbackData = [
            { name: { common: "South Africa" }, region: "Africa", flags: { svg: "https://flagcdn.com/za.svg" } },
            { name: { common: "Egypt" }, region: "Africa", flags: { svg: "https://flagcdn.com/eg.svg" } },
            { name: { common: "Kenya" }, region: "Africa", flags: { svg: "https://flagcdn.com/ke.svg" } },
            { name: { common: "Nigeria" }, region: "Africa", flags: { svg: "https://flagcdn.com/ng.svg" } },
            
            { name: { common: "United States" }, region: "Americas", flags: { svg: "https://flagcdn.com/us.svg" } },
            { name: { common: "Brazil" }, region: "Americas", flags: { svg: "https://flagcdn.com/br.svg" } },
            { name: { common: "Canada" }, region: "Americas", flags: { svg: "https://flagcdn.com/ca.svg" } },
            { name: { common: "Argentina" }, region: "Americas", flags: { svg: "https://flagcdn.com/ar.svg" } },
            
            { name: { common: "Japan" }, region: "Asia", flags: { svg: "https://flagcdn.com/jp.svg" } },
            { name: { common: "India" }, region: "Asia", flags: { svg: "https://flagcdn.com/in.svg" } },
            { name: { common: "South Korea" }, region: "Asia", flags: { svg: "https://flagcdn.com/kr.svg" } },
            { name: { common: "China" }, region: "Asia", flags: { svg: "https://flagcdn.com/cn.svg" } },
            
            { name: { common: "Germany" }, region: "Europe", flags: { svg: "https://flagcdn.com/de.svg" } },
            { name: { common: "France" }, region: "Europe", flags: { svg: "https://flagcdn.com/fr.svg" } },
            { name: { common: "United Kingdom" }, region: "Europe", flags: { svg: "https://flagcdn.com/gb.svg" } },
            { name: { common: "Italy" }, region: "Europe", flags: { svg: "https://flagcdn.com/it.svg" } },
            
            { name: { common: "Australia" }, region: "Oceania", flags: { svg: "https://flagcdn.com/au.svg" } },
            { name: { common: "New Zealand" }, region: "Oceania", flags: { svg: "https://flagcdn.com/nz.svg" } },
            { name: { common: "Fiji" }, region: "Oceania", flags: { svg: "https://flagcdn.com/fj.svg" } }
        ];

        async function fetchCountries() {
            try {
                // Set a timeout so we don't wait forever if connection is bad
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 seconds max

                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,region,flags', {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();
                
                allCountries = data.filter(c => c.flags && c.flags.svg && c.name.common);
                showHome();
                
            } catch (error) {
                console.log('Main API failed, loading fallback data...');
                // If network fails or browser blocks it, use the built-in fallback data
                allCountries = fallbackData;
                fallbackNotice.style.display = 'block'; 
                showHome();
            }
        }

        function showHome() {
            loadingScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        }

        function startQuiz(region) {
            currentFilteredCountries = allCountries.filter(country => country.region === region);
            
            if(currentFilteredCountries.length === 0) {
                alert("Could not load countries for this region.");
                return;
            }

            continentTitle.textContent = `Region: ${region}`;
            homeScreen.style.display = 'none';
            quizScreen.style.display = 'flex';
            homeBtn.style.display = 'flex';
            
            nextFlag();
        }

        function nextFlag() {
            const randomIndex = Math.floor(Math.random() * currentFilteredCountries.length);
            currentCountry = currentFilteredCountries[randomIndex];

            flagImage.src = currentCountry.flags.svg;
            countryNameDisplay.textContent = currentCountry.name.common;
            
            countryNameDisplay.style.opacity = '0';
            clickHint.style.bottom = '10px';
            clickHint.style.opacity = '1';
        }

        function revealCountry() {
            if (countryNameDisplay.style.opacity === '0') {
                countryNameDisplay.style.opacity = '1';
                clickHint.style.opacity = '0';
                clickHint.style.bottom = '-30px';
            }
        }

        function goHome() {
            quizScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
            homeBtn.style.display = 'none';
        }

        window.onload = fetchCountries;
    </script>
</body>
</html>
